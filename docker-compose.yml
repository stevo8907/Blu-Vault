version: '3.8'

services:
  blu-vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blu-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Optional: Provide your TMDB API Key if not configured in the web UI
      # - TMDB_API_KEY=your_tmdb_api_key_here
    volumes:
      - blu_vault_data:/app/data

volumes:
  blu_vault_data:
    driver: local
