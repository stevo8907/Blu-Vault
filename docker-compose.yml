services:
  blu-vault:
    build:
      context: .
      dockerfile: dockerfile
    container_name: blu-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=UTC
      - PUID=1000
      - PGID=1000
      - CONFIG_DIR=/config
    volumes:
      # Persistent host directory for databases, backups, and caches
      # Example host path: ./config (or /mnt/user/appdata/bluvault on Unraid / NAS)
      - ./config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

