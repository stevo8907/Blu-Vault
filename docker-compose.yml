services:
  blu-vault:
    build:
      context: .
      dockerfile: dockerfile
    container_name: blu-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=UTC
    volumes:
      # Persistent host path for databases (bluvault-system.json, bluvault-vault.json),
      # automated backups (/backups), and image/metadata caches (/cache)
      - ./config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

